linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - gocritic
    - gocyclo
    - dupl
    - gosec

linters-settings:
  gocyclo:
    min-complexity: 15
  dupl:
    threshold: 100
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
    # Ignore eBPF generated files
    - path: rate_limiter_bpf.*\.go
      linters:
        - all

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor
    - .vscode
    - .github

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
